<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Diagnóstico Operativo | Logística & Comercio Exterior Bogotá</title>

    <!-- Meta etiquetas Open Graph para vista previa atractiva en WhatsApp -->
    <meta property="og:title" content="Diagnóstico Ejecutivo 2026: Eficiencia en Logística y Comex (Bogotá)" />
    <meta property="og:description"
        content="Sondeo rápido de 2 minutos sobre cuellos de botella operativos y automatización. Recibe tu diagnóstico inmediato." />
    <meta property="og:type" content="website" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }

        .fade-in {
            animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .option-card {
            transition: all 0.18s ease;
        }

        .option-card:active {
            transform: scale(0.985);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-between bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950">

    <!-- Barra superior de progreso -->
    <header class="w-full max-w-lg mx-auto px-5 pt-6 pb-2">
        <div class="flex items-center justify-between text-xs text-slate-400 mb-2">
            <span class="font-semibold tracking-wider uppercase text-sky-400">Benchmarking Logístico • Bogotá</span>
            <span id="step-indicator">Inicio</span>
        </div>
        <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
            <div id="progress-bar" class="bg-sky-500 h-full transition-all duration-300 ease-out" style="width: 10%">
            </div>
        </div>
    </header>

    <!-- Contenedor principal dinámico -->
    <main id="app-container" class="w-full max-w-lg mx-auto px-5 py-4 flex-1 flex flex-col justify-center">
        <!-- Las pantallas se renderizan dinámicamente aquí -->
    </main>

    <!-- Pie de página discreto -->
    <footer class="w-full max-w-lg mx-auto px-5 py-4 text-center text-xs text-slate-500">
        Consultoría en Tecnología y Comercio Exterior • Datos 100% confidenciales
    </footer>

    <script>
        // =========================================================================
        // CONFIGURACIÓN PERSONALIZABLE
        // =========================================================================
        const CONFIG = {
            // Reemplaza con tu número de WhatsApp en formato internacional sin '+' (ej: 573001234567)
            tuWhatsapp: "573219296294",
            // Opcional: URL de tu webhook (Google Apps Script, n8n, Make, o endpoint REST)
            webhookUrl: "https://script.google.com/macros/s/AKfycbyygLMJ3TT9PDF4_QmpynyLCpFaZIbQWgwdXbawDjOBcfahgTbb_TbfruZVord_BTVm/exec"
        };

        // Captura parámetro opcional de la URL (?c=nombre_empresa)
        const urlParams = new URLSearchParams(window.location.search);
        const prospectRef = urlParams.get('c') || 'Directo';

        // =========================================================================
        // DEFINICIÓN DE PREGUNTAS (Enfoque Operadores Logísticos / Carga)
        // =========================================================================
        const QUESTIONS = [
            {
                id: "perfil",
                stepLabel: "1 de 6",
                title: "¿Cuál es el enfoque principal de tu empresa en la cadena logística?",
                subtitle: "Selecciona la opción que mejor los describa.",
                type: "single",
                options: [
                    {value: "Agente de carga (Freight Forwarder)", label: "Agente de carga internacional (Freight Forwarder)", score: 2},
                    {value: "Operador logístico 3PL / Almacenamiento", label: "Operador logístico (3PL) / Almacenamiento y distribución", score: 2},
                    {value: "Transporte terrestre de carga", label: "Transporte terrestre nacional / urbano de carga", score: 2},
                    {value: "Importador / Exportador directo", label: "Empresa importadora o exportadora (dueña de carga)", score: 2}
                ]
            },
            {
                id: "volumen",
                stepLabel: "2 de 6",
                title: "En promedio, ¿qué volumen de operaciones o despachos gestionan al mes?",
                subtitle: "Esto nos ayuda a segmentar el estudio por tamaño de operación.",
                type: "single",
                options: [
                    {value: "Menos de 20 al mes", label: "Menos de 20 operaciones al mes", score: 1},
                    {value: "Entre 20 y 80 al mes", label: "Entre 20 y 80 operaciones al mes", score: 2},
                    {value: "Entre 80 y 250 al mes", label: "Entre 80 y 250 operaciones al mes", score: 3},
                    {value: "Más de 250 al mes", label: "Más de 250 operaciones al mes", score: 3}
                ]
            },
            {
                id: "trazabilidad",
                stepLabel: "3 de 6",
                title: "¿Cómo reciben hoy sus clientes el estatus de sus cargas o despachos?",
                subtitle: "Piensa en el flujo habitual del día a día.",
                type: "single",
                options: [
                    {value: "Portal / Alertas automáticas", label: "Tienen acceso a un portal o reciben alertas automáticas", score: 1},
                    {value: "Reportes manuales en Excel/Correo", label: "Enviamos reportes periódicos armados en Excel o correo", score: 3},
                    {value: "Por demanda (WhatsApp/Llamadas)", label: "Principalmente cuando el cliente escribe o llama a preguntar", score: 4}
                ]
            },
            {
                id: "digitacion",
                stepLabel: "4 de 6",
                title: "¿Qué tanto tiempo invierte el equipo digitando datos de documentos (BL, facturas, manifiestos) o armando cotizaciones?",
                subtitle: "Identificando fricción operativa.",
                type: "single",
                options: [
                    {value: "Automatizado / Integrado", label: "Muy poco, nuestros sistemas leen o integran casi todo", score: 1},
                    {value: "Moderado (30%-50% manual)", label: "Moderado: usamos sistema, pero mucho se pasa a mano o Excel", score: 3},
                    {value: "Alto cuello de botella", label: "Alto: gran parte se digita línea por línea y frena la operación", score: 4}
                ]
            },
            {
                id: "rentabilidad",
                stepLabel: "5 de 6",
                title: "Al cerrar una operación o file, ¿qué tan rápido conocen su utilidad real (ingresos vs. costos de terceros)?",
                subtitle: "Control financiero por embarque o servicio.",
                type: "single",
                options: [
                    {value: "En tiempo real", label: "De inmediato, el sistema cruza costos y facturación al instante", score: 1},
                    {value: "Toma días de conciliación", label: "Toma varios días cruzar facturas de proveedores en Excel", score: 3},
                    {value: "Fugas ocasionales", label: "A veces detectamos sobrecostos no cobrados cuando ya cerró el mes", score: 4}
                ]
            },
            {
                id: "prioridad",
                stepLabel: "6 de 6",
                title: "Si pudieran implementar en menos de 6 semanas una mejora puntual conectada a lo que ya tienen, ¿cuál elegirían?",
                subtitle: "Selecciona la de mayor impacto inmediato para tu equipo.",
                type: "single",
                options: [
                    {value: "Trazabilidad automática a clientes", label: "Portal o notificaciones automáticas de estatus para clientes", score: 3},
                    {value: "Lectura automática de documentos PDF", label: "Extracción automática de datos de BL, facturas o manifiestos", score: 3},
                    {value: "Cotizador ágil y control de márgenes", label: "Cotizador rápido con tarifarios centralizados", score: 3},
                    {value: "Control financiero por operación", label: "Tablero de rentabilidad real por file (costos vs. facturación)", score: 3}
                ]
            }
        ];

        // Estado de la aplicación
        let currentStep = -1; // -1 = Bienvenida, 0..N-1 = Preguntas, N = Contacto, N+1 = Resultado
        const answers = {
            referencia_url: prospectRef,
            fecha: new Date().toISOString()
        };

        const container = document.getElementById("app-container");
        const progressBar = document.getElementById("progress-bar");
        const stepIndicator = document.getElementById("step-indicator");

        // =========================================================================
        // RENDERIZADO DE PANTALLAS
        // =========================================================================
        function render() {
            const totalSteps = QUESTIONS.length + 2;

            // 1. PANTALLA DE BIENVENIDA
            if (currentStep === -1) {
                progressBar.style.width = "8%";
                stepIndicator.textContent = "2 minutos";
                container.innerHTML = `
          <div class="fade-in space-y-6">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-sky-500/10 border border-sky-500/20 text-sky-400 text-xs font-medium">
              <span>🇨🇴 Estudio Sectorial Bogotá 2026</span>
            </div>
            
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white leading-snug">
              ¿Dónde se está fugando tiempo y margen en tu operación logística?
            </h1>
            
            <p class="text-slate-300 text-sm sm:text-base leading-relaxed">
              Responde <strong>6 preguntas rápidas</strong> (sin escribir textos largos). Al finalizar recibirás un <strong>diagnóstico inmediato de eficiencia operativa</strong> y el resumen comparativo del gremio en Bogotá.
            </p>

            <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-4 space-y-2 text-xs text-slate-300">
              <div class="flex items-center gap-2">
                <span class="text-emerald-400 font-bold">✓</span>
                <span>100% enfocado en realidad operativa y tecnológica</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="text-emerald-400 font-bold">✓</span>
                <span>Resultados anónimos y confidenciales</span>
              </div>
            </div>

            <button onclick="nextStep()" class="w-full py-4 px-6 bg-sky-500 hover:bg-sky-400 active:bg-sky-600 text-slate-950 font-bold rounded-xl shadow-lg shadow-sky-500/20 transition text-base">
              Comenzar diagnóstico →
            </button>
          </div>
        `;
                return;
            }

            // 2. PANTALLAS DE PREGUNTAS
            if (currentStep >= 0 && currentStep < QUESTIONS.length) {
                const q = QUESTIONS[currentStep];
                const progress = Math.round(((currentStep + 1) / totalSteps) * 100);
                progressBar.style.width = `${progress}%`;
                stepIndicator.textContent = q.stepLabel;

                const optionsHtml = q.options.map((opt, idx) => {
                    const isSelected = answers[q.id]?.value === opt.value;
                    return `
            <button onclick="selectOption('${q.id}', ${idx})" 
              class="option-card w-full text-left p-4 rounded-xl border ${isSelected
                            ? 'bg-sky-500/15 border-sky-400 text-white'
                            : 'bg-slate-800/60 border-slate-700/80 hover:border-slate-500 text-slate-200'
                        } flex items-center justify-between gap-3">
              <span class="text-sm sm:text-base font-medium leading-snug">${opt.label}</span>
              <span class="w-5 h-5 rounded-full border flex-shrink-0 flex items-center justify-center ${isSelected ? 'border-sky-400 bg-sky-400 text-slate-950' : 'border-slate-600'
                        }">
                ${isSelected ? '✓' : ''}
              </span>
            </button>
          `;
                }).join("");

                container.innerHTML = `
          <div class="fade-in space-y-5">
            <div>
              <h2 class="text-xl sm:text-2xl font-bold text-white leading-snug mb-1.5">${q.title}</h2>
              <p class="text-xs sm:text-sm text-slate-400">${q.subtitle}</p>
            </div>

            <div class="space-y-3">
              ${optionsHtml}
            </div>

            <div class="pt-2 flex items-center justify-between">
              <button onclick="prevStep()" class="text-sm text-slate-400 hover:text-white py-2 px-3">
                ← Anterior
              </button>
            </div>
          </div>
        `;
                return;
            }

            // 3. PANTALLA DE CIERRE Y CONTACTO
            if (currentStep === QUESTIONS.length) {
                progressBar.style.width = "92%";
                stepIndicator.textContent = "Último paso";

                container.innerHTML = `
          <div class="fade-in space-y-5">
            <div>
              <span class="text-xs font-semibold uppercase tracking-wider text-emerald-400">¡Listo! Ya tenemos tus respuestas</span>
              <h2 class="text-xl sm:text-2xl font-bold text-white mt-1 leading-snug">
                ¿A dónde te enviamos el informe comparativo del sector?
              </h2>
              <p class="text-xs sm:text-sm text-slate-400 mt-1">
                Al continuar verás tu diagnóstico inmediato en pantalla.
              </p>
            </div>

            <form onsubmit="submitSurvey(event)" class="space-y-3.5">
              <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Tu nombre *</label>
                <input type="text" id="input-nombre" required placeholder="Ej. Carlos Mendoza"
                  class="w-full px-4 py-3 rounded-xl bg-slate-800/80 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-sky-400 text-sm" />
              </div>

              <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Empresa *</label>
                <input type="text" id="input-empresa" required value="${prospectRef !== 'Directo' ? prospectRef : ''}" placeholder="Nombre de tu empresa"
                  class="w-full px-4 py-3 rounded-xl bg-slate-800/80 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-sky-400 text-sm" />
              </div>

              <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Correo corporativo o WhatsApp *</label>
                <input type="text" id="input-contacto" required placeholder="carlos@empresa.com / 300..."
                  class="w-full px-4 py-3 rounded-xl bg-slate-800/80 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-sky-400 text-sm" />
              </div>

              <div class="pt-2 flex items-center justify-between gap-3">
                <button type="button" onclick="prevStep()" class="text-sm text-slate-400 hover:text-white py-3 px-3">
                  ← Atrás
                </button>
                <button type="submit" id="btn-submit" class="flex-1 py-3.5 px-6 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-emerald-500/20 transition text-sm sm:text-base">
                  Ver mi diagnóstico →
                </button>
              </div>
            </form>
          </div>
        `;
                return;
            }

            // 4. PANTALLA DE DIAGNÓSTICO AUTOMÁTICO (CONVERSIÓN)
            if (currentStep > QUESTIONS.length) {
                progressBar.style.width = "100%";
                stepIndicator.textContent = "Completado";

                const diag = calcularDiagnostico();
                const whatsappMsg = encodeURIComponent(
                    `Hola, acabo de completar el diagnóstico operativo de ${answers.empresa}. Me interesa revisar cómo automatizar: ${answers.prioridad?.value}.`
                );

                container.innerHTML = `
          <div class="fade-in space-y-5">
            <div class="p-5 rounded-2xl bg-slate-800/80 border border-slate-700 space-y-3">
              <div class="flex items-center justify-between">
                <span class="text-xs font-semibold uppercase tracking-wider text-sky-400">Resultado Preliminar</span>
                <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${diag.badgeClass}">${diag.nivel}</span>
              </div>
              
              <h2 class="text-xl font-bold text-white leading-snug">${diag.titulo}</h2>
              <p class="text-sm text-slate-300 leading-relaxed">${diag.descripcion}</p>
              
              <div class="pt-2 border-t border-slate-700/80">
                <p class="text-xs text-slate-400 mb-1">Foco recomendado de alto impacto:</p>
                <p class="text-sm font-semibold text-emerald-400">→ ${answers.prioridad?.value}</p>
              </div>
            </div>

            <div class="p-4 rounded-xl bg-sky-950/40 border border-sky-500/30 space-y-3">
              <p class="text-xs sm:text-sm text-slate-200 leading-relaxed">
                <strong>¿Quieres ver un caso práctico aplicado a ${answers.empresa}?</strong><br>
                Podemos agendar una sesión corta de 15 minutos sin costo para mostrarte cómo resolver este cuello de botella sin cambiar tu ERP actual.
              </p>
              <a href="https://wa.me/${CONFIG.tuWhatsapp}?text=${whatsappMsg}" target="_blank"
                class="block w-full text-center py-3.5 px-4 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl transition text-sm">
                Agendar sesión de 15 min por WhatsApp
              </a>
            </div>
          </div>
        `;
            }
        }

        // =========================================================================
        // LÓGICA DE NAVEGACIÓN Y DIAGNÓSTICO
        // =========================================================================
        function nextStep() {
            currentStep++;
            render();
        }

        function prevStep() {
            if (currentStep > -1) {
                currentStep--;
                render();
            }
        }

        function selectOption(questionId, optionIndex) {
            const question = QUESTIONS.find(q => q.id === questionId);
            answers[questionId] = question.options[optionIndex];
            render();
            // Avance automático suave tras 220ms para experiencia fluida en celular
            setTimeout(() => {
                nextStep();
            }, 220);
        }

        function calcularDiagnostico() {
            const score = (answers.trazabilidad?.score || 0) +
                (answers.digitacion?.score || 0) +
                (answers.rentabilidad?.score || 0);

            if (score >= 9) {
                return {
                    nivel: "Potencial de Ahorro Alto",
                    badgeClass: "bg-amber-500/20 text-amber-300 border border-amber-500/30",
                    titulo: "Alta carga manual con oportunidad inmediata de automatización",
                    descripcion: "Tu operación presenta fricción significativa en tareas repetitivas y consolidación de información. Automatizar solo el flujo crítico que seleccionaste puede liberar entre 10 y 15 horas semanales de tu equipo."
                };
            } else if (score >= 6) {
                return {
                    nivel: "Potencial de Ahorro Medio-Alto",
                    badgeClass: "bg-sky-500/20 text-sky-300 border border-sky-500/30",
                    titulo: "Base operativa sólida, pero con brechas conectadas por Excel",
                    descripcion: "Aunque ya cuentan con estructura, la dependencia de procesos manuales entre áreas genera demoras y riesgo de reprocesos. Una integración puntual tendría un retorno muy rápido."
                };
            } else {
                return {
                    nivel: "Madurez Digital Avanzada",
                    badgeClass: "bg-emerald-500/20 text-emerald-300 border border-emerald-500/30",
                    titulo: "Operación bien estructurada lista para optimización inteligente",
                    descripcion: "Tienen buen control operativo. El siguiente paso natural para diferenciarse es incorporar analítica predictiva, lectura documental con IA o portales de autoservicio para clientes."
                };
            }
        }

        async function submitSurvey(event) {
            event.preventDefault();
            const btn = document.getElementById("btn-submit");
            btn.disabled = true;
            btn.textContent = "Procesando diagnóstico...";

            answers.nombre = document.getElementById("input-nombre").value.trim();
            answers.empresa = document.getElementById("input-empresa").value.trim();
            answers.contacto = document.getElementById("input-contacto").value.trim();

            // Enviar a Webhook si está configurado
            if (CONFIG.webhookUrl) {
                try {
                    await fetch(CONFIG.webhookUrl, {
                        method: "POST",
                        mode: "no-cors",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify(answers)
                    });
                } catch (e) {
                    console.error("Error enviando datos:", e);
                }
            } else {
                console.log("Respuestas capturadas:", answers);
            }

            nextStep();
        }

        // Inicializar
        render();
    </script>
</body>

</html>
